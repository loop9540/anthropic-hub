<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Filing Desk</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>&#128450;</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap">
<style id="app-css">
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f6f7fb; --surface:#ffffff; --surface2:#eceff8; --ink:#323338; --ink2:#676879; --ink3:#9699a6;
  --line:#d0d4e4; --line2:#c3c6d4;
  --accent:#0073ea; --accent-hover:#0060b9; --accent-soft:#e5f0ff; --accent-ink:#ffffff;
  --danger:#d83a52; --danger-bg:#fde7ea; --warn:#a25e00; --warn-bg:#fdf0dc; --ok:#007a45; --ok-bg:#e0f7ec;
  --p-red:#e2445c; --p-amber:#fdab3d; --p-yellow:#ffcb00; --p-green:#00c875; --p-gray:#c4c4c4;
  --p-yellow-ink:#3d3000; --p-gray-ink:#323338;
  --chip:#eceff8; --rail:#292f4c; --rail-ink:#c5c7d0; --rail-active:#0073ea;
  --shadow:0 1px 2px rgba(41,47,76,.06),0 4px 12px rgba(41,47,76,.06);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#111323; --surface:#181b34; --surface2:#222647; --ink:#eeeff5; --ink2:#a5a8c0; --ink3:#71748f;
    --line:#393b53; --line2:#4b4e69;
    --accent:#3d8bff; --accent-hover:#639fff; --accent-soft:#1f3a5f; --accent-ink:#ffffff;
    --danger:#f07284; --danger-bg:#3c2230; --warn:#e8b165; --warn-bg:#35291a; --ok:#4fd394; --ok-bg:#173729;
    --p-gray:#5c5f77; --p-gray-ink:#eeeff5;
    --chip:#262a4e; --rail:#0e1020; --rail-ink:#8f92ad; --rail-active:#3d8bff;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 12px rgba(0,0,0,.3);
  }
}
:root[data-theme="dark"]{
  --bg:#111323; --surface:#181b34; --surface2:#222647; --ink:#eeeff5; --ink2:#a5a8c0; --ink3:#71748f;
  --line:#393b53; --line2:#4b4e69;
  --accent:#3d8bff; --accent-hover:#639fff; --accent-soft:#1f3a5f; --accent-ink:#ffffff;
  --danger:#f07284; --danger-bg:#3c2230; --warn:#e8b165; --warn-bg:#35291a; --ok:#4fd394; --ok-bg:#173729;
  --p-gray:#5c5f77; --p-gray-ink:#eeeff5;
  --chip:#262a4e; --rail:#0e1020; --rail-ink:#8f92ad; --rail-active:#3d8bff;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 12px rgba(0,0,0,.3);
}
html{font-size:16px}
body{background:var(--bg);color:var(--ink);font-family:'Figtree',system-ui,-apple-system,sans-serif;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
input,select{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line2);border-radius:4px;padding:.4rem .55rem}
input:focus-visible,select:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.mono{font-variant-numeric:tabular-nums}

.shell{display:flex;min-height:100vh}
.rail{width:56px;flex:none;background:var(--rail);display:flex;flex-direction:column;align-items:center;gap:.4rem;padding:.7rem 0;position:sticky;top:0;height:100vh}
.logo{width:34px;height:34px;border-radius:8px;background:linear-gradient(135deg,#0073ea,#a25ddc);color:#fff;font-weight:800;font-size:.85rem;display:flex;align-items:center;justify-content:center;margin-bottom:.6rem;letter-spacing:.02em}
.rbtn{width:38px;height:38px;border-radius:8px;color:var(--rail-ink);display:flex;align-items:center;justify-content:center}
.rbtn:hover{background:rgba(255,255,255,.09);color:#fff}
.rbtn[aria-selected="true"]{background:var(--rail-active);color:#fff}
.rbtn svg{width:19px;height:19px}
.rspacer{flex:1}

.wrap{flex:1;min-width:0;max-width:1120px;margin:0 auto;padding:1.1rem 1.4rem 4rem}
.masthead{display:flex;align-items:center;justify-content:space-between;gap:1rem;flex-wrap:wrap;padding:.3rem 0 1rem}
.masthead h1{font-weight:800;font-size:1.55rem;letter-spacing:-.01em}
.masthead .sub{color:var(--ink2);font-size:.85rem;margin-top:.05rem}
.masthead .actions{display:flex;gap:.5rem;align-items:center;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:.4rem;padding:.45rem .85rem;border-radius:4px;font-weight:600;font-size:.85rem;border:1px solid var(--line2);background:var(--surface);color:var(--ink)}
.btn:hover{background:var(--surface2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{background:var(--accent-hover);border-color:var(--accent-hover)}
.btn.danger{color:var(--danger);border-color:var(--danger)}
.btn.danger:hover{background:var(--danger-bg)}
.btn.small{padding:.25rem .55rem;font-size:.78rem;font-weight:500}
.savechip{font-size:.75rem;font-weight:600;color:var(--ink3);padding:.2rem .55rem;border-radius:99px;border:1px solid var(--line)}
.savechip[data-s="pending"]{color:var(--warn);border-color:var(--warn)}
.savechip[data-s="saved"]{color:var(--ok);border-color:var(--ok)}
.savechip[data-s="error"]{color:var(--danger);border-color:var(--danger)}
.banner{background:var(--warn-bg);color:var(--warn);border:1px solid var(--warn);border-radius:8px;padding:.6rem .9rem;font-size:.85rem;margin-bottom:1rem}

.av{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%;color:#fff;font-size:.62rem;font-weight:700;flex:none;letter-spacing:.02em}
.mechip{display:inline-flex;align-items:center;gap:.4rem;font-size:.8rem;font-weight:600;color:var(--ink);background:var(--surface);border:1px solid var(--line2);border-radius:99px;padding:.22rem .7rem .22rem .3rem}
.mechip:hover{background:var(--surface2)}

.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:.7rem;margin-bottom:1.2rem}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:.75rem .95rem;box-shadow:var(--shadow)}
.tile .num{font-size:1.75rem;font-weight:800;line-height:1.15;font-variant-numeric:tabular-nums}
.tile .lbl{font-size:.72rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--ink2);display:flex;align-items:center;gap:.4rem}
.tile .dot{width:.6rem;height:.6rem;border-radius:3px;flex:none}
.tile[data-k="overdue"] .num{color:var(--danger)} .tile[data-k="overdue"] .dot{background:var(--p-red)}
.tile[data-k="week"] .num{color:var(--warn)} .tile[data-k="week"] .dot{background:var(--p-amber)}
.tile[data-k="month"] .dot{background:var(--accent)}
.tile[data-k="filed"] .num{color:var(--ok)} .tile[data-k="filed"] .dot{background:var(--p-green)}

.filters{display:flex;gap:.5rem;flex-wrap:wrap;align-items:center;margin-bottom:1.1rem;font-size:.85rem}
.filters select{padding:.3rem .45rem;font-size:.85rem}
.filters label.chk{display:inline-flex;align-items:center;gap:.35rem;color:var(--ink2);cursor:pointer}

.mgroup{margin-bottom:1.35rem}
.mgroup>h3{font-size:.95rem;font-weight:700;color:var(--gc,var(--accent));margin-bottom:.5rem;display:flex;align-items:center;gap:.45rem}
.mgroup>h3::before{content:'';width:4px;height:1.05rem;border-radius:2px;background:var(--gc,var(--accent))}
.rows{display:flex;flex-direction:column;gap:.4rem}
.row{background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--gc,var(--line2));border-radius:6px;box-shadow:var(--shadow)}
.row:hover{border-color:var(--line2);border-left-color:var(--gc,var(--line2))}
.row[data-st="done"]{opacity:.72}
.rhead{display:flex;align-items:center;gap:.65rem;padding:.5rem .8rem;flex-wrap:wrap}
.ck{width:1.3rem;height:1.3rem;border:2px solid var(--line2);border-radius:50%;flex:none;display:inline-flex;align-items:center;justify-content:center;font-size:.75rem;color:transparent}
.ck:hover{border-color:var(--p-green);color:var(--p-green)}
.row[data-st="done"] .ck{background:var(--p-green);border-color:var(--p-green);color:#fff}
.rtitle{font-weight:600;font-size:.9rem;flex:1 1 14rem;min-width:0}
.rtitle .co{color:var(--ink2);font-weight:500}
.chips{display:flex;gap:.3rem;flex-wrap:wrap;align-items:center}
.chip{font-size:.7rem;font-weight:600;letter-spacing:.02em;padding:.12rem .5rem;border-radius:99px;background:var(--chip);color:var(--ink2);white-space:nowrap;display:inline-flex;align-items:center;gap:.3rem}
.chip.ex{background:var(--accent-soft);color:var(--accent)}
.chip.who{padding-left:.15rem}
.prog{width:72px;height:14px;background:var(--chip);border-radius:3px;overflow:hidden;flex:none}
.prog span{display:block;height:100%;background:var(--p-green);border-radius:0 2px 2px 0}
.due{text-align:right;flex:none;min-width:8.2rem}
.due .d{font-size:.82rem;font-weight:700;font-variant-numeric:tabular-nums}
.due .rel{font-size:.72rem;color:var(--ink3)}
.row[data-st="overdue"] .due .rel{color:var(--danger);font-weight:700}
.row[data-st="urgent"] .due .rel,.row[data-st="soon"] .due .rel{color:var(--warn);font-weight:700}
.pill{font-size:.72rem;font-weight:700;padding:.24rem 0;border-radius:4px;flex:none;width:104px;text-align:center;color:#fff}
.pill[data-st="overdue"]{background:var(--p-red)}
.pill[data-st="urgent"]{background:var(--p-amber);color:#4b2900}
.pill[data-st="soon"]{background:var(--p-yellow);color:var(--p-yellow-ink)}
.pill[data-st="upcoming"]{background:var(--p-gray);color:var(--p-gray-ink)}
.pill[data-st="done"]{background:var(--p-green)}
.exp{color:var(--ink3);font-size:.8rem;padding:.2rem .4rem;border-radius:4px}
.exp:hover{background:var(--surface2);color:var(--ink)}
.rbody{border-top:1px solid var(--line);padding:.75rem .9rem .85rem;display:grid;gap:.8rem;grid-template-columns:1fr;font-size:.86rem}
@media(min-width:720px){.rbody{grid-template-columns:1.4fr 1fr}}
.steps{display:flex;flex-direction:column;gap:.3rem}
.steps h4,.meta h4{font-size:.72rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3);margin-bottom:.25rem}
.step{display:flex;align-items:flex-start;gap:.45rem;cursor:pointer}
.step input{width:auto;accent-color:var(--p-green);margin-top:.25rem}
.step span{flex:1}
.step.on span{color:var(--ink3);text-decoration:line-through}
.stamp{font-size:.7rem;color:var(--ink3);font-weight:500;margin-left:.15rem;white-space:nowrap;display:inline-block}
.meta{display:flex;flex-direction:column;gap:.55rem}
.meta .fld{display:flex;flex-direction:column;gap:.2rem}
.meta .fld label{font-size:.74rem;font-weight:600;color:var(--ink2)}
.meta input,.meta select{font-size:.84rem}

.cogrid{display:grid;gap:.8rem;grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
.cocard{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:1rem;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:.6rem}
.cocard h3{font-size:1rem;font-weight:700;display:flex;align-items:center;gap:.5rem}
.coav{display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:6px;color:#fff;font-size:.72rem;font-weight:800;flex:none}
.cocard .tk{color:var(--ink2);font-weight:500;font-size:.85rem}
.cocard .facts{font-size:.8rem;color:var(--ink2);display:flex;gap:.4rem;flex-wrap:wrap}
.cocard .next{border-top:1px solid var(--line);padding-top:.55rem;display:flex;flex-direction:column;gap:.3rem;font-size:.82rem}
.cocard .next .n{display:flex;justify-content:space-between;gap:.6rem}
.cocard .next .n .d{font-size:.78rem;color:var(--ink2);flex:none;font-variant-numeric:tabular-nums}
.cocard .foot{display:flex;gap:.4rem;margin-top:auto}
.empty{background:var(--surface);border:1px dashed var(--line2);border-radius:8px;padding:2.2rem 1.5rem;text-align:center;color:var(--ink2)}
.empty h3{color:var(--ink);font-size:1.05rem;margin-bottom:.35rem}
.empty p{max-width:34rem;margin:0 auto .9rem;font-size:.9rem}

.refwrap{display:flex;flex-direction:column;gap:1.3rem}
.refcard{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:1rem 1.1rem;box-shadow:var(--shadow)}
.refcard h3{font-size:.95rem;font-weight:700;margin-bottom:.2rem}
.refcard .note{font-size:.8rem;color:var(--ink2);margin-bottom:.6rem}
.tscroll{overflow-x:auto}
table.ref{border-collapse:collapse;width:100%;font-size:.84rem;min-width:540px}
table.ref th{text-align:left;font-size:.72rem;letter-spacing:.05em;text-transform:uppercase;color:var(--ink3);font-weight:700;padding:.35rem .6rem;border-bottom:1px solid var(--line2)}
table.ref td{padding:.42rem .6rem;border-bottom:1px solid var(--line);vertical-align:top}
table.ref td.mono{white-space:nowrap;font-variant-numeric:tabular-nums}

.modalbg{position:fixed;inset:0;background:rgba(41,47,76,.5);display:flex;align-items:flex-start;justify-content:center;padding:4vh 1rem;z-index:50;overflow:auto}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow);width:100%;max-width:470px;padding:1.2rem 1.3rem}
.modal h2{font-size:1.1rem;font-weight:700;margin-bottom:.9rem}
.modal .fld{display:flex;flex-direction:column;gap:.25rem;margin-bottom:.75rem}
.modal .fld label{font-size:.78rem;font-weight:600;color:var(--ink2)}
.modal .grid2{display:grid;grid-template-columns:1fr 1fr;gap:.7rem}
.modal .foot{display:flex;justify-content:flex-end;gap:.5rem;margin-top:1rem}
.modal .hint{font-size:.76rem;color:var(--ink3);margin-top:.15rem}
.people{display:flex;flex-direction:column;gap:.4rem}
.people .p{display:flex;align-items:center;gap:.5rem;background:var(--surface2);border-radius:6px;padding:.3rem .3rem .3rem .7rem}
.people .p span{flex:1;font-size:.88rem}
.whobtns{display:flex;flex-wrap:wrap;gap:.5rem;margin-bottom:.8rem}
.whobtns .btn{font-size:.9rem}

#toast{position:fixed;left:50%;bottom:1.2rem;transform:translateX(-50%);z-index:60;display:flex;flex-direction:column;gap:.4rem;align-items:center;pointer-events:none}
.tmsg{background:var(--rail);color:#fff;padding:.55rem .95rem;border-radius:6px;font-size:.85rem;box-shadow:var(--shadow);max-width:90vw}
@media (prefers-reduced-motion: no-preference){
  .tmsg{animation:tin .18s ease-out}
  @keyframes tin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
}
@media(max-width:560px){
  .shell{flex-direction:column}
  .rail{width:100%;height:auto;flex-direction:row;position:static;padding:.4rem .7rem}
  .logo{margin-bottom:0}
  .rspacer{flex:1}
  .pill{width:88px}
}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast"></div>


<script id="app-js">
(function(){
'use strict';

/* ---------- state & session ---------- */
var state = null;
var VERSION = 0;
function normalize(st){
  st = st || {};
  st.v = st.v || 1;
  st.companies = st.companies || [];
  st.records = st.records || {};
  st.custom = st.custom || [];
  st.people = st.people || [];
  st.settings = st.settings || {};
  if (typeof st.settings.dueSoonDays !== 'number') st.settings.dueSoonDays = 14;
  return st;
}

var ui = {tab:'deadlines', fCo:'', fWho:'', fSt:'', showDone:false, open:{}, modal:null, edit:null};
try { var s = sessionStorage.getItem('fd-ui'); if (s) { var p = JSON.parse(s); for (var k in p) ui[k] = p[k]; ui.modal = null; ui.edit = null; } } catch(e){}

var readOnly = false;
var saveTimer = null, saveState = 'idle', pendingSave = false;

var me = '';
try { me = localStorage.getItem('fd-me') || ''; } catch(e){}
function stampNow(){ return {by: me, at: new Date().toISOString()}; }
function fmtStamp(v){
  if (!v || typeof v !== 'object' || !v.by) return '';
  var d = v.at ? new Date(v.at) : null;
  var when = d && !isNaN(d) ? MS[d.getMonth()]+' '+d.getDate()+', '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0') : '';
  return v.by + (when ? ' · '+when : '');
}

/* ---------- date helpers ---------- */
var MN = ['January','February','March','April','May','June','July','August','September','October','November','December'];
var MS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function mkDate(y,m,d){ return new Date(y, m-1, d, 12, 0, 0); }
function daysInMonth(y,m){ return new Date(y, m, 0).getDate(); }
function addDays(dt,n){ var d = new Date(dt); d.setDate(d.getDate()+n); return d; }
function todayD(){ var n = new Date(); return mkDate(n.getFullYear(), n.getMonth()+1, n.getDate()); }
function iso(dt){ return dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0')+'-'+String(dt.getDate()).padStart(2,'0'); }
function fromIso(s){ var p = s.split('-'); return mkDate(+p[0], +p[1], +p[2]); }
function fmtD(dt){ return MS[dt.getMonth()]+' '+dt.getDate()+', '+dt.getFullYear(); }
function daysUntil(dt){ return Math.round((dt - todayD()) / 86400000); }
function relStr(n){
  if (n === 0) return 'due today';
  if (n === 1) return 'due tomorrow';
  if (n > 1) return 'in '+n+' days';
  if (n === -1) return '1 day overdue';
  return (-n)+' days overdue';
}
function monthShift(y,m,delta){ var t = (y*12 + (m-1)) + delta; return {y: Math.floor(t/12), m: (t%12+12)%12 + 1}; }
function fifthTradingDay(y,m){
  var count = 0, d = 1, dim = daysInMonth(y,m);
  while (d <= dim) {
    var dow = mkDate(y,m,d).getDay();
    if (dow !== 0 && dow !== 6) { count++; if (count === 5) return mkDate(y,m,d); }
    d++;
  }
  return mkDate(y,m,dim);
}

/* ---------- checklist templates ---------- */
var CHK = {
  annual: ['Close the books; working papers to auditor','Audit fieldwork complete / auditor clearance','Draft annual financial statements','Draft annual MD&A','Audit committee review and recommendation','Board approval of statements and MD&A','CEO/CFO annual certifications signed','File statements + MD&A + certifications on SEDAR+'],
  interim: ['Prepare interim financial statements','Interim MD&A (or quarterly highlights)','Audit committee / board approval','CEO/CFO interim certifications signed','File on SEDAR+'],
  form7: ['Draft Form 7 monthly progress report','Sign Form 6 certificate of compliance','Post both on CSE portal before open of 5th trading day'],
  execcomp: ['Compile compensation data','Draft Form 51-102F6V (venture) / F6','Committee and board sign-off','File on SEDAR+ (or include in information circular)'],
  aif: ['Draft AIF (Form 51-102F2)','Board approval','File on SEDAR+'],
  agm: ['Set record date and meeting date (check exchange notice rules)','Draft information circular (51-102F5) and proxy','NI 54-101 beneficial-owner delivery / notice-and-access','File meeting materials on SEDAR+ when sent','Hold the meeting','File report of voting results']
};

/* ---------- schedule generation ---------- */
function companySenior(c){ return c.exchange === 'CSE' && !!c.nv; }
function schedForCompany(c){
  var items = [];
  var senior = companySenior(c);
  var t = todayD();
  var lo = addDays(t, -285), hi = addDays(t, 400);
  var yeM = c.yeMonth, yeD = c.yeDay;
  var y0 = t.getFullYear();
  for (var y = y0-2; y <= y0+2; y++) {
    var fye = mkDate(y, yeM, Math.min(yeD, daysInMonth(y, yeM)));
    var fy = 'FY'+y;
    push(items, c, 'annual', fy, fye, addDays(fye, senior?90:120),
      'Annual financial statements + MD&A + certifications', CHK.annual, 'Financials');
    push(items, c, 'execcomp', fy, fye, addDays(fye, senior?140:180),
      'Executive compensation disclosure', CHK.execcomp, 'Governance');
    if (senior) push(items, c, 'aif', fy, fye, addDays(fye, 90), 'Annual Information Form', CHK.aif, 'Governance');
    push(items, c, 'agm', fy, fye, addDays(fye, 180), 'AGM held, circular sent, voting results filed', CHK.agm, 'Governance');
    for (var qi = 1; qi <= 3; qi++) {
      var sh = monthShift(y, yeM, -3*(4-qi));
      var qEnd = mkDate(sh.y, sh.m, Math.min(yeD, daysInMonth(sh.y, sh.m)));
      push(items, c, 'q'+qi, fy, qEnd, addDays(qEnd, senior?45:60),
        'Q'+qi+' interim statements + MD&A + certifications', CHK.interim, 'Financials');
    }
  }
  if (c.exchange === 'CSE') {
    for (var off = -8; off <= 13; off++) {
      var now = todayD();
      var ms = monthShift(now.getFullYear(), now.getMonth()+1, off);
      var due = fifthTradingDay(ms.y, ms.m);
      var prev = monthShift(ms.y, ms.m, -1);
      var pe = mkDate(prev.y, prev.m, daysInMonth(prev.y, prev.m));
      push(items, c, 'form7', MS[prev.m-1]+' '+prev.y, pe, due,
        'CSE Form 7 monthly progress report + Form 6', CHK.form7, 'Exchange');
    }
  }
  var since = c.since ? fromIso(c.since) : null;
  return items.filter(function(it){ return it.due >= lo && it.due <= hi && (!since || it.due >= since); });
}
function push(arr, c, type, period, periodEnd, due, title, checklist, cat){
  arr.push({ key: c.id+':'+type+':'+iso(periodEnd), companyId: c.id, type: type,
    period: period, due: due, title: title, checklist: checklist, cat: cat });
}
function allItems(){
  var items = [];
  state.companies.forEach(function(c){ items = items.concat(schedForCompany(c)); });
  state.custom.forEach(function(x){
    items.push({ key: 'custom:'+x.id, companyId: x.companyId || '', type: 'custom',
      period: '', due: fromIso(x.due), title: x.title, checklist: [], cat: 'Custom', customId: x.id });
  });
  items.sort(function(a,b){ return a.due - b.due; });
  return items;
}
function rec(key){ return state.records[key]; }
function statusOf(it){
  var r = rec(it.key);
  if (r && r.done) return 'done';
  var d = daysUntil(it.due);
  if (d < 0) return 'overdue';
  if (d <= 7) return 'urgent';
  if (d <= state.settings.dueSoonDays) return 'soon';
  return 'upcoming';
}
var ST_LBL = {overdue:'Overdue', urgent:'Due this week', soon:'Due soon', upcoming:'Upcoming', done:'Filed'};

/* ---------- rendering ---------- */
function esc(s){ return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function coById(id){ for (var i=0;i<state.companies.length;i++) if (state.companies[i].id===id) return state.companies[i]; return null; }
function coLabel(c){ return c ? (c.ticker ? c.ticker : c.name) : ''; }
function exChip(c){
  if (!c) return '';
  var t = c.exchange === 'CSE' ? (c.nv ? 'CSE · NV' : 'CSE') : 'TSXV';
  return '<span class="chip ex">'+t+'</span>';
}
function personOpts(sel){
  var h = '<option value="">Unassigned</option>';
  state.people.forEach(function(p){ h += '<option value="'+esc(p)+'"'+(p===sel?' selected':'')+'>'+esc(p)+'</option>'; });
  return h;
}

var AVC = ['#0073ea','#00c875','#a25ddc','#e2445c','#fdab3d','#579bfc','#784bd1','#ff642e'];
var GRP = ['#0073ea','#00c875','#a25ddc','#fdab3d','#e2445c','#579bfc'];
function avColor(n){ var h = 0; for (var i=0;i<n.length;i++) h = (h*31 + n.charCodeAt(i)) >>> 0; return AVC[h % AVC.length]; }
function initials(n){ var p = String(n).trim().split(/\s+/); var s = (p[0]||'').charAt(0) + (p.length>1 ? p[p.length-1].charAt(0) : ''); return s.toUpperCase(); }
function avatar(n){ return n ? '<span class="av" style="background:'+avColor(n)+'">'+esc(initials(n))+'</span>' : ''; }

function render(){
  var items = allItems();
  var t = todayD();
  var counts = {overdue:0, week:0, month:0, filed:0};
  items.forEach(function(it){
    var st = statusOf(it);
    if (st === 'done') { var r = rec(it.key); if (r && r.filedOn && fromIso(r.filedOn).getFullYear() === t.getFullYear()) counts.filed++; return; }
    var d = daysUntil(it.due);
    if (d < 0) counts.overdue++;
    else { if (d <= 7) counts.week++; if (d <= 30) counts.month++; }
  });

  var h = '<div class="shell"><aside class="rail"><div class="logo">FD</div><button class="rbtn" data-action="tab" data-v="deadlines" title="Deadlines" aria-label="Deadlines" aria-selected="'+(ui.tab==='deadlines')+'"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 10h18M9 10v10"/></svg></button><button class="rbtn" data-action="tab" data-v="companies" title="Companies" aria-label="Companies" aria-selected="'+(ui.tab==='companies')+'"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 21V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v16M4 21h16M16 9h3a1 1 0 0 1 1 1v11M8 7h4M8 11h4M8 15h4"/></svg></button><button class="rbtn" data-action="tab" data-v="reference" title="Reference" aria-label="Reference" aria-selected="'+(ui.tab==='reference')+'"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20V3H6.5A2.5 2.5 0 0 0 4 5.5v14zM4 19.5A2.5 2.5 0 0 0 6.5 22H20v-2.5"/></svg></button><div class="rspacer"></div><button class="rbtn" data-action="open-settings" title="Team &amp; settings" aria-label="Team and settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1.03 1.56V21a2 2 0 1 1-4 0v-.09a1.7 1.7 0 0 0-1.03-1.56 1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.7 1.7 0 0 0 4.6 15a1.7 1.7 0 0 0-1.56-1.03H3a2 2 0 1 1 0-4h.09A1.7 1.7 0 0 0 4.65 8.9a1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.7 1.7 0 0 0 1.87.34h.01A1.7 1.7 0 0 0 10.05 3V3a2 2 0 1 1 4 0v.09a1.7 1.7 0 0 0 1.03 1.56 1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.7 1.7 0 0 0-.34 1.87v.01c.26.63.87 1.03 1.56 1.03H21a2 2 0 1 1 0 4h-.09c-.69 0-1.3.4-1.56 1.03z"/></svg></button></aside><div class="wrap">';
  h += '<header class="masthead"><div><h1>Filing Desk</h1><div class="sub">Continuous disclosure tracker — TSXV &amp; CSE issuers</div></div>';
  h += '<div class="actions"><span class="savechip" data-s="'+saveState+'">'+
       (readOnly ? 'Read-only' : saveState==='pending' ? 'Saving…' : saveState==='error' ? 'Save failed' : saveState==='saved' ? 'Saved' : 'Up to date')+'</span>';
  if (!readOnly) {
    h += '<button class="mechip" data-action="open-whoami" title="Actions you take are recorded under this name">'+(me ? avatar(me)+'<span>'+esc(me)+'</span>' : '<span style="padding-left:.4rem">Set your name</span>')+'</button>';
    h += '<button class="btn" data-action="open-custom">Add one-off item</button>';
    h += '<button class="btn primary" data-action="open-company">Add company</button>';
  }
  h += '</div></header>';

  if (readOnly) h += '<div class="banner">This view is read-only — changes here will not be saved. Ask the dashboard owner for edit access.</div>';

  h += '<div class="tiles">'+
    tile('overdue','Overdue',counts.overdue)+
    tile('week','Due in 7 days',counts.week)+
    tile('month','Due in 30 days',counts.month)+
    tile('filed','Filed in '+t.getFullYear(),counts.filed)+
    '</div>';

  if (ui.tab === 'deadlines') h += renderDeadlines(items);
  else if (ui.tab === 'companies') h += renderCompanies(items);
  else h += renderReference();

  h += '</div></div>';
  h += renderModal();
  document.getElementById('app').innerHTML = h;
}
function tile(k,lbl,n){ return '<div class="tile" data-k="'+k+'"><div class="lbl"><span class="dot"></span>'+lbl+'</div><div class="num">'+n+'</div></div>'; }
function tab(id,lbl){ return '<button class="tab" role="tab" aria-selected="'+(ui.tab===id)+'" data-action="tab" data-v="'+id+'">'+lbl+'</button>'; }

function renderDeadlines(items){
  var h = '<div class="filters">';
  h += '<select data-action="f-co"><option value="">All companies</option>';
  state.companies.forEach(function(c){ h += '<option value="'+c.id+'"'+(ui.fCo===c.id?' selected':'')+'>'+esc(c.name)+'</option>'; });
  h += '</select>';
  h += '<select data-action="f-who"><option value="">Everyone</option>';
  state.people.forEach(function(p){ h += '<option value="'+esc(p)+'"'+(ui.fWho===p?' selected':'')+'>'+esc(p)+'</option>'; });
  h += '</select>';
  h += '<select data-action="f-st"><option value="">Any status</option>';
  ['overdue','urgent','soon','upcoming'].forEach(function(s){ h += '<option value="'+s+'"'+(ui.fSt===s?' selected':'')+'>'+ST_LBL[s]+'</option>'; });
  h += '</select>';
  h += '<label class="chk"><input type="checkbox" data-action="f-done"'+(ui.showDone?' checked':'')+'> Show filed</label>';
  h += '</div>';

  var visible = items.filter(function(it){
    var st = statusOf(it);
    if (st === 'done' && !ui.showDone) return false;
    if (ui.fCo && it.companyId !== ui.fCo) return false;
    if (ui.fSt && st !== ui.fSt) return false;
    if (ui.fWho) {
      var r = rec(it.key); var who = (r && r.assignee) || (coById(it.companyId)||{}).assignee || '';
      if (who !== ui.fWho) return false;
    }
    return true;
  });

  if (!state.companies.length && !state.custom.length) {
    return h + '<div class="empty"><h3>No companies yet</h3><p>Add each company you manage — its exchange (TSXV or CSE), tier and financial year-end — and Filing Desk builds the full filing calendar automatically: annual and interim statements, MD&amp;A, certifications, executive compensation, AGM, and CSE monthly Form 7s.</p>'+(!readOnly?'<button class="btn primary" data-action="open-company">Add your first company</button>':'')+'</div>';
  }
  if (!visible.length) return h + '<div class="empty"><h3>Nothing matches these filters</h3><p>Clear a filter or turn on “Show filed”.</p></div>';

  var byMonth = {};
  var order = [];
  visible.forEach(function(it){
    var mk = it.due.getFullYear()+'-'+String(it.due.getMonth()+1).padStart(2,'0');
    if (!byMonth[mk]) { byMonth[mk] = []; order.push(mk); }
    byMonth[mk].push(it);
  });
  order.forEach(function(mk, gi){
    var d0 = byMonth[mk][0].due;
    h += '<section class="mgroup" style="--gc:'+GRP[gi % GRP.length]+'"><h3>'+MN[d0.getMonth()]+' '+d0.getFullYear()+'</h3><div class="rows">';
    byMonth[mk].forEach(function(it){ h += renderRow(it); });
    h += '</div></section>';
  });
  return h;
}

function renderRow(it){
  var st = statusOf(it);
  var r = rec(it.key) || {};
  var c = coById(it.companyId);
  var open = !!ui.open[it.key];
  var d = daysUntil(it.due);
  var who = r.assignee || (c && c.assignee) || '';
  var late = r.done && r.filedOn && fromIso(r.filedOn) > it.due;
  var h = '<article class="row" data-st="'+st+'">';
  h += '<div class="rhead">';
  h += '<button class="ck" data-action="toggle-done" data-k="'+esc(it.key)+'" title="'+(r.done?'Mark not filed':'Mark filed')+'" aria-label="'+(r.done?'Mark not filed':'Mark filed')+'">✓</button>';
  h += '<div class="rtitle">'+esc(it.title)+(it.period?' <span class="co">· '+esc(it.period)+'</span>':'')+'</div>';
  h += '<div class="chips">'+(c?'<span class="chip">'+esc(coLabel(c))+'</span>'+exChip(c):'')+
       '<span class="chip">'+esc(it.cat)+'</span>'+
       (who?'<span class="chip who">'+avatar(who)+esc(who)+'</span>':'')+
       (late?'<span class="chip" style="background:var(--warn-bg);color:var(--warn)">Filed late</span>':'')+'</div>';
  if (it.checklist.length) {
    var cdn = 0; if (r.checks) it.checklist.forEach(function(_,ci){ if (r.checks[ci]) cdn++; });
    var pct = st==='done' ? 100 : Math.round(100*cdn/it.checklist.length);
    h += '<div class="prog" title="'+cdn+' of '+it.checklist.length+' checklist steps done"><span style="width:'+pct+'%"></span></div>';
  }
  h += '<span class="pill" data-st="'+st+'">'+ST_LBL[st]+'</span>';
  var doneTxt = st==='done' ? ('filed '+(r.filedOn?fmtD(fromIso(r.filedOn)):'')+(r.doneStamp&&r.doneStamp.by?' · '+r.doneStamp.by:'')) : relStr(d);
  h += '<div class="due"><div class="d">'+fmtD(it.due)+'</div><div class="rel">'+esc(doneTxt)+'</div></div>';
  h += '<button class="exp" data-action="expand" data-k="'+esc(it.key)+'" aria-expanded="'+open+'">'+(open?'Close ▲':'Details ▼')+'</button>';
  h += '</div>';
  if (open) {
    h += '<div class="rbody">';
    h += '<div class="steps"><h4>Checklist</h4>';
    if (it.checklist.length) {
      it.checklist.forEach(function(sTxt,i){
        var on = r.checks && r.checks[i];
        var stp = on ? fmtStamp(on) : '';
        h += '<label class="step'+(on?' on':'')+'"><input type="checkbox" data-action="step" data-k="'+esc(it.key)+'" data-i="'+i+'"'+(on?' checked':'')+(readOnly?' disabled':'')+'><span>'+esc(sTxt)+(stp?' <span class="stamp">'+esc(stp)+'</span>':'')+'</span></label>';
      });
    } else h += '<div style="color:var(--ink3)">No checklist for this item.</div>';
    h += '</div>';
    h += '<div class="meta">';
    h += '<div class="fld"><label>Assigned to</label><select data-action="assign" data-k="'+esc(it.key)+'"'+(readOnly?' disabled':'')+'>'+personOpts(who)+'</select></div>';
    h += '<div class="fld"><label>Filed on</label><input type="date" value="'+esc(r.filedOn||'')+'" data-action="filedon" data-k="'+esc(it.key)+'"'+(readOnly?' disabled':'')+'></div>';
    h += '<div class="fld"><label>Note</label><input type="text" value="'+esc(r.note||'')+'" placeholder="e.g. waiting on auditor" data-action="note" data-k="'+esc(it.key)+'"'+(readOnly?' disabled':'')+'></div>';
    if (it.type === 'custom' && !readOnly) h += '<div><button class="btn small danger" data-action="del-custom" data-k="'+esc(it.customId)+'">Delete item</button></div>';
    h += '</div></div>';
  }
  h += '</article>';
  return h;
}

function renderCompanies(items){
  if (!state.companies.length) return '<div class="empty"><h3>No companies yet</h3><p>Add the companies whose filings you manage.</p>'+(!readOnly?'<button class="btn primary" data-action="open-company">Add company</button>':'')+'</div>';
  var h = '<div class="cogrid">';
  state.companies.forEach(function(c){
    var next = items.filter(function(it){ return it.companyId===c.id && statusOf(it)!=='done'; }).slice(0,4);
    h += '<div class="cocard"><div><h3><span class="coav" style="background:'+avColor(c.name)+'">'+esc(initials(c.name))+'</span>'+esc(c.name)+' <span class="tk">'+esc(c.ticker||'')+'</span></h3></div>';
    h += '<div class="facts">'+exChip(c)+'<span class="chip">Year-end '+MS[c.yeMonth-1]+' '+c.yeDay+'</span>'+(c.assignee?'<span class="chip">'+esc(c.assignee)+'</span>':'')+'</div>';
    h += '<div class="next">';
    if (next.length) next.forEach(function(it){
      var st = statusOf(it);
      h += '<div class="n"><span>'+esc(it.title)+'</span><span class="d"'+(st==='overdue'?' style="color:var(--danger);font-weight:600"':'')+'>'+fmtD(it.due)+'</span></div>';
    });
    else h += '<div style="color:var(--ink3)">Nothing outstanding in the window.</div>';
    h += '</div>';
    if (!readOnly) h += '<div class="foot"><button class="btn small" data-action="edit-company" data-k="'+c.id+'">Edit</button><button class="btn small danger" data-action="ask-del-company" data-k="'+c.id+'">Remove</button></div>';
    h += '</div>';
  });
  return h + '</div>';
}

  return h + '</div>';

    var dc = coById(ui.edit);
    h += '<h2>Remove '+esc(dc?dc.name:'company')+'?</h2><p style="font-size:.88rem;color:var(--ink2)">This deletes the company, its generated calendar and its filing history from the dashboard. It cannot be undone.</p>';
    h += '<div class="foot"><button class="btn" data-action="close">Cancel</button><button class="btn danger" data-action="del-company">Remove company</button></div>';
  }
  return h + '</div></div>';
}

/* ---------- mutations & persistence ---------- */
function mutate(fn){
  if (readOnly) { toast('Read-only view — this change was not saved.'); return; }
  if (!me && ui.modal !== 'whoami') {
    ui.modal = 'whoami'; render();
    toast('First, tell the dashboard who you are — then redo that change.');
    return;
  }
  fn();
  render();
  scheduleSave();
}
function setMe(name){
  name = (name || '').trim();
  if (!name) return;
  me = name;
  try { localStorage.setItem('fd-me', me); } catch(e){}
  if (state.people.indexOf(me) === -1) mutate(function(){ state.people.push(me); ui.modal = null; });
  else { ui.modal = null; render(); }
}
function ensureRec(key){ if (!state.records[key]) state.records[key] = {}; return state.records[key]; }

function scheduleSave(){
  pendingSave = true; saveState = 'pending'; paintSaveChip();
  clearTimeout(saveTimer);
  saveTimer = setTimeout(function(){ doSave(false); }, 1200);
}
function api(path, opts){
  opts = opts || {};
  opts.headers = Object.assign({'Content-Type':'application/json'}, opts.headers || {});
  opts.credentials = 'same-origin';
  return fetch(path, opts);
}
function paintSaveChip(){
  var el = document.querySelector('.savechip');
  if (el) { el.dataset.s = saveState; el.textContent = readOnly?'Read-only': saveState==='pending'?'Saving…': saveState==='error'?'Save failed': saveState==='saved'?'Saved':'Up to date'; }
}
function doSave(retried){
  api('/api/state', {method:'PUT', body: JSON.stringify({version: VERSION, state: state})}).then(function(r){
    if (r.status === 401) { renderLogin(''); return; }
    if (r.status === 409) {
      return r.json().then(function(doc){
        VERSION = doc.version; state = normalize(doc.state);
        pendingSave = false; saveState = 'idle'; render();
        toast('Someone else saved at the same moment - showing their version. Please re-apply your last change.');
      });
    }
    if (r.status === 503) { saveState = 'error'; paintSaveChip(); toast('Storage is not configured yet - attach the Upstash Redis store in Vercel.'); return; }
    if (!r.ok) throw new Error('save_failed');
    return r.json().then(function(j){ VERSION = j.version; pendingSave = false; saveState = 'saved'; paintSaveChip(); });
  }).catch(function(){
    if (!retried) saveTimer = setTimeout(function(){ doSave(true); }, 1500 + Math.random()*1500);
    else { saveState = 'error'; paintSaveChip(); toast('Could not save - check your connection. Your changes are still on screen; the next edit retries.'); }
  });
}
function toast(msg){
  var box = document.getElementById('toast');
  var el = document.createElement('div');
  el.className = 'tmsg'; el.textContent = msg;
  box.appendChild(el);
  setTimeout(function(){ el.remove(); }, 5200);
}

/* ---------- events ---------- */
document.addEventListener('click', function(e){
  var t = e.target.closest('[data-action]');
  if (!t) return;
  var a = t.dataset.action, k = t.dataset.k;
  if (a === 'tab') { ui.tab = t.dataset.v; render(); }
  else if (a === 'expand') { ui.open[k] = !ui.open[k]; render(); }
  else if (a === 'toggle-done') mutate(function(){
    var r = ensureRec(k);
    r.done = !r.done;
    if (r.done) {
      if (!r.filedOn) r.filedOn = iso(todayD());
      r.doneStamp = stampNow();
    } else { delete r.filedOn; delete r.doneStamp; }
  });
  else if (a === 'open-company') { ui.modal='company'; ui.edit=null; render(); }
  else if (a === 'edit-company') { ui.modal='company'; ui.edit=coById(k); render(); }
  else if (a === 'save-company') saveCompanyFromForm();
  else if (a === 'ask-del-company') { ui.modal='del-company'; ui.edit=k; render(); }
  else if (a === 'del-company') mutate(function(){
    var id = ui.edit;
    state.companies = state.companies.filter(function(c){ return c.id !== id; });
    Object.keys(state.records).forEach(function(rk){ if (rk.indexOf(id+':')===0) delete state.records[rk]; });
    state.custom = state.custom.filter(function(x){ return x.companyId !== id; });
    ui.modal=null; ui.edit=null;
  });
  else if (a === 'open-custom') { ui.modal='custom'; render(); }
  else if (a === 'save-custom') saveCustomFromForm();
  else if (a === 'del-custom') mutate(function(){
    state.custom = state.custom.filter(function(x){ return String(x.id) !== String(k); });
    delete state.records['custom:'+k];
  });
  else if (a === 'open-whoami') { ui.modal='whoami'; render(); }
  else if (a === 'pick-me') setMe(k);
  else if (a === 'save-me') setMe(document.getElementById('m-me').value);
  else if (a === 'open-settings') { ui.modal='settings'; render(); }
  else if (a === 'add-person') {
    var inp = document.getElementById('m-person');
    var name = (inp.value||'').trim();
    if (name && state.people.indexOf(name) === -1) mutate(function(){ state.people.push(name); });
  }
  else if (a === 'del-person') mutate(function(){ state.people.splice(+k,1); });
  else if (a === 'save-settings') {
    var v = +document.getElementById('m-soon').value;
    mutate(function(){ if (v>=3 && v<=60) state.settings.dueSoonDays = v; ui.modal=null; });
  }
  else if (a === 'close') { ui.modal=null; ui.edit=null; render(); }
  else if (a === 'close-bg') { if (e.target === t) { ui.modal=null; ui.edit=null; render(); } }
});
document.addEventListener('change', function(e){
  var t = e.target.closest('[data-action]');
  if (!t) return;
  var a = t.dataset.action, k = t.dataset.k, v = t.value;
  if (a === 'f-co') { ui.fCo = v; render(); }
  else if (a === 'f-who') { ui.fWho = v; render(); }
  else if (a === 'f-st') { ui.fSt = v; render(); }
  else if (a === 'f-done') { ui.showDone = t.checked; render(); }
  else if (a === 'step') mutate(function(){ var r = ensureRec(k); r.checks = r.checks || {}; if (t.checked) r.checks[t.dataset.i] = stampNow(); else delete r.checks[t.dataset.i]; });
  else if (a === 'assign') mutate(function(){ ensureRec(k).assignee = v; });
  else if (a === 'filedon') mutate(function(){ var r = ensureRec(k); if (v) r.filedOn = v; else delete r.filedOn; });
  else if (a === 'note') mutate(function(){ var r = ensureRec(k); if (v) r.note = v; else delete r.note; });
});
function saveCompanyFromForm(){
  var name = (document.getElementById('m-name').value||'').trim();
  if (!name) { toast('Company name is required.'); return; }
  var yeD = Math.min(31, Math.max(1, +document.getElementById('m-yed').value || 31));
  var data = {
    name: name,
    ticker: (document.getElementById('m-ticker').value||'').trim().toUpperCase(),
    exchange: document.getElementById('m-ex').value,
    nv: document.getElementById('m-nv').checked,
    yeMonth: +document.getElementById('m-yem').value,
    yeDay: yeD,
    since: document.getElementById('m-since').value || '',
    assignee: document.getElementById('m-who').value
  };
  if (data.exchange !== 'CSE') data.nv = false;
  mutate(function(){
    if (ui.edit) { for (var kk in data) ui.edit[kk] = data[kk]; }
    else { data.id = 'c' + Date.now().toString(36); state.companies.push(data); }
    ui.modal = null; ui.edit = null;
  });
}
function saveCustomFromForm(){
  var title = (document.getElementById('m-title').value||'').trim();
  var due = document.getElementById('m-due').value;
  if (!title || !due) { toast('A title and a due date are required.'); return; }
  var co = document.getElementById('m-co').value;
  mutate(function(){
    state.custom.push({id: Date.now().toString(36), title: title, due: due, companyId: co});
    ui.modal = null;
  });
}
window.addEventListener('beforeunload', function(e){
  if (pendingSave && !readOnly) { e.preventDefault(); e.returnValue = ''; }
});

/* ---------- boot: login, load, poll ---------- */
function renderLogin(msg){
  document.getElementById('app').innerHTML =
    '<div class="wrap" style="max-width:420px;padding-top:14vh">'+
    '<h1 style="font-weight:800;font-size:1.7rem;margin-bottom:.2rem">Filing Desk</h1>'+
    '<div style="color:var(--ink2);font-size:.9rem;margin-bottom:1.2rem">Continuous disclosure tracker - TSXV &amp; CSE issuers</div>'+
    '<div style="background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:1.2rem 1.3rem">'+
    '<label style="font-size:.8rem;font-weight:600;color:var(--ink2);display:block;margin-bottom:.3rem">Access code</label>'+
    '<form id="loginform" style="display:flex;gap:.5rem"><input id="pw" type="password" autocomplete="current-password" style="flex:1"><button class="btn primary" type="submit">Enter</button></form>'+
    (msg?'<div style="color:var(--danger);font-size:.82rem;margin-top:.6rem">'+esc(msg)+'</div>':'')+
    '</div></div>';
  var f = document.getElementById('loginform');
  f.addEventListener('submit', function(e){
    e.preventDefault();
    api('/api/login', {method:'POST', body: JSON.stringify({password: document.getElementById('pw').value})}).then(function(r){
      if (r.ok) boot();
      else if (r.status === 401) renderLogin('Wrong access code - try again.');
      else renderLogin('Login failed - is APP_PASSWORD set in Vercel?');
    }).catch(function(){ renderLogin('Network error - try again.'); });
  });
  document.getElementById('pw').focus();
}
function renderLoading(note){
  document.getElementById('app').innerHTML = '<div class="wrap" style="text-align:center;padding-top:18vh;color:var(--ink2)">'+esc(note||'Loading...')+'</div>';
}
function boot(){
  renderLoading();
  api('/api/state').then(function(r){
    if (r.status === 401) { renderLogin(''); return; }
    if (r.status === 503) { renderLoading('Storage is not configured yet - in Vercel, attach an Upstash Redis store to this project, then reload.'); return; }
    if (!r.ok) throw new Error('load_failed');
    return r.json().then(function(doc){
      VERSION = doc.version; state = normalize(doc.state);
      render();
      if (!me && !ui.modal) { ui.modal = 'whoami'; render(); }
      startPoll();
    });
  }).catch(function(){ renderLoading('Could not reach the server - check your connection and reload.'); });
}
var pollTimer = null;
function startPoll(){
  if (pollTimer) return;
  pollTimer = setInterval(function(){
    if (pendingSave || document.hidden || ui.modal) return;
    api('/api/state').then(function(r){ if (r.ok) return r.json(); }).then(function(doc){
      if (doc && doc.version > VERSION && !pendingSave) { VERSION = doc.version; state = normalize(doc.state); render(); }
    }).catch(function(){});
  }, 45000);
}
boot();
})();
</script>
